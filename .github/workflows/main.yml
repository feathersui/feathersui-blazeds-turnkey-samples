name: CI

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  samples-misc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5
      - name: Set up Haxelib dependencies
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install feathersui --quiet
          haxelib install feathersui-rpc-services --quiet
          haxelib install feathersui-formatters --quiet
      - name: Build runtimeconfig-messaging
        working-directory: runtimeconfig-messaging
        run: |
          haxelib run openfl build neko
          haxelib run openfl build html5
          haxelib run openfl build flash
          haxelib run openfl build hl
      - name: Build runtimeconfig-remoting
        working-directory: runtimeconfig-remoting
        run: |
          haxelib run openfl build neko
          haxelib run openfl build html5
          haxelib run openfl build flash
          haxelib run openfl build hl
      - name: Build testdrive-101
        working-directory: testdrive-101
        run: |
          haxelib run openfl build neko
          haxelib run openfl build html5
          haxelib run openfl build flash
          haxelib run openfl build hl
      - name: Build testdrive-chat
        working-directory: testdrive-chat
        run: |
          haxelib run openfl build neko
          haxelib run openfl build html5
          haxelib run openfl build flash
          haxelib run openfl build hl
      - name: Build testdrive-datapush
        working-directory: testdrive-datapush
        run: |
          haxelib run openfl build neko
          haxelib run openfl build html5
          haxelib run openfl build flash
          haxelib run openfl build hl
      - name: Build testdrive-httpservice
        working-directory: testdrive-httpservice
        run: |
          haxelib run openfl build neko
          haxelib run openfl build html5
          haxelib run openfl build flash
          haxelib run openfl build hl
      - name: Build testdrive-remoteobject
        working-directory: testdrive-remoteobject
        run: |
          haxelib run openfl build neko
          haxelib run openfl build html5
          haxelib run openfl build flash
          haxelib run openfl build hl
      - name: Build testdrive-update
        working-directory: testdrive-update
        run: |
          haxelib run openfl build neko
          haxelib run openfl build html5
          haxelib run openfl build flash
          haxelib run openfl build hl

  samples-air:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "33.1"
          accept-license: true
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5
      - uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"
      - name: Set up Haxelib dependencies
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install feathersui --quiet
          haxelib install feathersui-rpc-services --quiet
          haxelib install feathersui-formatters --quiet
          haxelib run lime config AIR_SDK ${{ env.AIR_HOME }}
      - name: Build runtimeconfig-messaging
        working-directory: runtimeconfig-messaging
        run: |
          haxelib run openfl build air
      - name: Build runtimeconfig-remoting
        working-directory: runtimeconfig-remoting
        run: |
          haxelib run openfl build air
      - name: Build testdrive-101
        working-directory: testdrive-101
        run: |
          haxelib run openfl build air
      - name: Build testdrive-chat
        working-directory: testdrive-chat
        run: |
          haxelib run openfl build air
      - name: Build testdrive-datapush
        working-directory: testdrive-datapush
        run: |
          haxelib run openfl build air
      - name: Build testdrive-httpservice
        working-directory: testdrive-httpservice
        run: |
          haxelib run openfl build air
      - name: Build testdrive-remoteobject
        working-directory: testdrive-remoteobject
        run: |
          haxelib run openfl build air
      - name: Build testdrive-update
        working-directory: testdrive-update
        run: |
          haxelib run openfl build air
